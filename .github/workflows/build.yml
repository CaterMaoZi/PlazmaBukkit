name: Build Plazma Jar
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure memory
        run: |
          grep -q "^org.gradle.jvmargs" gradle.properties && \
            sed -i 's/^org.gradle.jvmargs.*/org.gradle.jvmargs = -Xmx6G -Dfile.encoding=UTF-8/' gradle.properties || \
            echo "org.gradle.jvmargs = -Xmx6G -Dfile.encoding=UTF-8" >> gradle.properties
          cat > mem.init.gradle.kts <<'KTS'
          allprojects {
              tasks.withType<JavaCompile>().configureEach {
                  options.isFork = true
                  options.forkOptions.memoryMaximumSize = "8192m"
              }
          }
          KTS
          sed -i 's/^          //' mem.init.gradle.kts
          echo "--- init script ---"
          cat mem.init.gradle.kts
      - name: Apply patches
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "CI"
          ./gradlew -I mem.init.gradle.kts applyAllPatches --no-daemon
      - name: Build paperclip
        run: ./gradlew -I mem.init.gradle.kts createMojmapPaperclipJar --no-daemon
      - name: Locate jars
        run: find . -name "*.jar" | grep -iE "paperclip|bundler" || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plazma-jars
          path: "**/build/libs/*.jar"
          if-no-files-found: error
