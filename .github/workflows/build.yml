name: Build Plazma Jar
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure memory
        run: |
          grep -q "^org.gradle.jvmargs" gradle.properties &&             sed -i 's/^org.gradle.jvmargs.*/org.gradle.jvmargs = -Xmx12G -Dfile.encoding=UTF-8/' gradle.properties ||             echo "org.gradle.jvmargs = -Xmx12G -Dfile.encoding=UTF-8" >> gradle.properties
          grep jvmargs gradle.properties
      - name: Apply patches
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "CI"
          ./gradlew applyAllPatches --no-daemon
      - name: Build paperclip
        run: ./gradlew createMojmapPaperclipJar --no-daemon
      - name: Locate jars
        run: find . -name "*.jar" | grep -iE "paperclip|bundler" || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plazma-jars
          path: "**/build/libs/*.jar"
          if-no-files-found: error
